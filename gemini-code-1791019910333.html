<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans Thai',system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}

const S={0:"A: Software Understanding",11:"B: User Interface",24:"C: Using Command",34:"D: Setting up",44:"E: Problem Solving"};
const MIN=90,$=s=>document.querySelector(s),ans={};let t=MIN*60,done=false,tm;

$('#sub-title').textContent = `${Q.length} ข้อ ข้อละ 2 คะแนน รวม ${Q.length*2} คะแนน เวลา ${MIN} นาที`;

Q.forEach((q,i)=>{
 if(S[i]){const h=document.createElement('h2');h.textContent=S[i];$('#qs').append(h)}
 const d=document.createElement('section');d.id='q'+i;
 const p=document.createElement('p');p.textContent=(i+1)+'. '+q[0];d.append(p);
 q[1].forEach((o,j)=>{const l=document.createElement('label'),r=document.createElement('input'),s=document.createElement('span');
  r.type='radio';r.name='q'+i;r.value=j;s.textContent=o;l.append(r,s);d.append(l)});
 $('#qs').append(d)});
 
$('#pg').textContent='ตอบแล้ว 0/'+Q.length;

$('#qs').addEventListener('change',e=>{
 if(e.target.name){
  ans[+e.target.name.slice(1)]=+e.target.value;
  $('#pg').textContent='ตอบแล้ว '+Object.keys(ans).length+'/'+Q.length;
 }
});

function tick(){t--;const m=Math.floor(t/60),s=t%60;$('#tm').textContent=m+':'+String(s).padStart(2,'0');if(t<=0)fin()}
tm=setInterval(tick,1000);

function fin(){
 if(done)return;done=true;clearInterval(tm);let sc=0;
 Q.forEach((q,i)=>{if(ans[i]===q[2])sc+=2;
  document.querySelectorAll('#q'+i+' label').forEach((l,j)=>{if(j===q[2])l.classList.add('ok');else if(j===ans[i])l.classList.add('bad');l.firstChild.disabled=true})});
 const r=$('#res'),tot=Q.length*2;r.hidden=false;
 r.textContent='คะแนนที่ได้ '+sc+'/'+tot+' ('+Math.round(sc*100/tot)+'%) ตอบถูก '+sc/2+' จาก '+Q.length+' ข้อ';
 $('#sb').hidden=true;$('#rs').hidden=false;window.scrollTo({top:0})}

$('#sb').onclick=fin;$('#rs').onclick=()=>location.reload();
</script></body></html>
